name: Deploy Appnix SaaS

on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf "%b" "${{ secrets.DEPLOY_SSH_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key_path: ~/.ssh/deploy_key
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 10m

          script: |
            set -e

            echo "🚀 Starting Appnix SaaS deployment..."

            cd /var/www/appnix-saas

            echo "📥 Pulling latest code..."
            git fetch origin master
            git reset --hard origin/master

            echo "📦 Installing backend dependencies..."
            cd backend
            npm ci

            echo "🗄️ Applying Prisma migrations..."
            npx prisma migrate deploy

            echo "🔨 Building backend..."
            npm run build

            echo "♻️ Restarting backend..."
            pm2 restart appnix-backend --update-env

            echo "💾 Saving PM2 process list..."
            pm2 save

            echo "🏥 Checking backend health..."

            for i in {1..12}; do
              if curl -fsS https://api.appnix.co.in/api/v1/health; then
                echo ""
                echo "✅ Backend health check passed!"
                echo "🎉 Deployment completed successfully!"
                exit 0
              fi

              echo ""
              echo "⏳ Backend not ready yet... attempt $i/12"
              sleep 5
            done

            echo ""
            echo "❌ Backend health check failed after 60 seconds."
            echo ""
            echo "📊 PM2 status:"
            pm2 status

            echo ""
            echo "📜 Recent backend logs:"
            pm2 logs appnix-backend --lines 50 --nostream

            exit 1
